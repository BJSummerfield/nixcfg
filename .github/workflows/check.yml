name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Write scope is only exercised by the ref-advance step, but it applies to
  # the whole job, including pull_request runs that never reach that step.
  contents: write

# Pushes to main share a group and stay serialized, so two cannot race the
# ref; each PR gets its own group and runs independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Named once: the substituter below and the push target further down have
    # to agree, and the hosts pin the same pair in modules/system/nixos.nix.
    env:
      CACHE_STORE: "s3://spacefunk-nix-cache?endpoint=s3.us-east-005.backblazeb2.com&region=us-east-005"
      CACHE_PUBLIC_KEY: "spacefunk-nix-cache-1:y3hr8PFKky16X7YDVH/PUDUG4gGEtrYcthUWKL4XrA4="
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # a shallow clone cannot push: "shallow update not allowed"

      # A runner starts with an empty store every run, so without the private
      # cache as a substituter every PR recompiles what main already built.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.CACHE_STORE }}
            extra-trusted-public-keys = ${{ env.CACHE_PUBLIC_KEY }}

      # impureEnvVars are read from the builder's environment, which is
      # nix-daemon under a multi-user install, so a shell export would not
      # reach the fetch. The same is true of the cache read, so both
      # credentials go in together.
      - name: Give nix-daemon the private-source and cache credentials
        env:
          PRIVATE_SRC_PAT: ${{ secrets.PRIVATE_SRC_PAT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_CACHE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_CACHE_APP_KEY }}
        run: ./ci/nix-daemon-creds.sh

      - run: nix flake check --print-build-logs

      # Runs before the ref advances so hosts never see a config whose closure
      # is not yet in the cache.
      - name: Push cached packages to the binary cache
        if: github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_CACHE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_CACHE_APP_KEY }}
        run: |
          # outPath is a pure-eval attribute, so this names every path without
          # building or fetching anything. A store path is hashed from the
          # derivation's inputs, so the name alone identifies the build: any
          # store holding that name holds those exact bits.
          cached=$(nix eval --json --apply \
            'ps:
               let names = builtins.filter (n: (ps.${n}.cache or false)) (builtins.attrNames ps);
               in { inherit names; outs = map (n: ps.${n}.outPath) names; }' \
            .#packages.x86_64-linux)
          mapfile -t attrs < <(jq -r '.names[]' <<<"$cached")
          mapfile -t outs < <(jq -r '.outs[]' <<<"$cached")

          # An empty list means the marker was lost, not that there is nothing
          # to do; pushing nothing would silently leave hosts compiling.
          if [ "${#attrs[@]}" -eq 0 ]; then
            echo "no package sets passthru.cache = true" >&2
            exit 1
          fi

          # Probed one at a time, and per package rather than in one batch: a
          # `nix copy` of an already-cached path still realises it locally
          # before discovering the destination has it, so naming an unchanged
          # package here would drag its whole closure back down. Resolution
          # walks .narinfo files — a few hundred bytes each, listing their own
          # references — so no NAR is fetched either way.
          echo "probing the cache for: ${attrs[*]}"
          missing=()
          for i in "${!attrs[@]}"; do
            if nix path-info -r --store "$CACHE_STORE" "${outs[$i]}" >/dev/null 2>&1; then
              echo "  present: ${attrs[$i]}"
            else
              echo "  missing: ${attrs[$i]}"
              missing+=(".#${attrs[$i]}")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "cache is complete; nothing to push"
          else
            umask 077
            printf '%s' "${{ secrets.NIX_CACHE_SIGNING_KEY }}" > "$RUNNER_TEMP/cache-key.sec"
            nix copy --to "$CACHE_STORE&secret-key=$RUNNER_TEMP/cache-key.sec" "${missing[@]}"
            shred -u "$RUNNER_TEMP/cache-key.sec"
          fi

          # Retention is manifest-driven because nix copy skips paths already
          # present, so object timestamps do not track whether a path is live.
          # Read back from the destination, so it also fails the run if a push
          # left the closure incomplete, or a prune deleted a dependency out
          # from under a live path.
          nix path-info -r --store "$CACHE_STORE" "${outs[@]}" > "$RUNNER_TEMP/closure.txt"
          sort -u "$RUNNER_TEMP/closure.txt" | jq -R . | jq -s . > "$RUNNER_TEMP/manifest.json"
          nix shell nixpkgs#awscli2 -c aws --endpoint-url https://s3.us-east-005.backblazeb2.com \
            s3 cp "$RUNNER_TEMP/manifest.json" \
            "s3://spacefunk-nix-cache/manifests/$(printf '%08d' "$GITHUB_RUN_NUMBER")-${GITHUB_SHA}.json"

      # Not forced: after a force-push to main this is rejected as a
      # non-fast-forward and the run goes red, rather than moving the hosts
      # onto rewritten history.
      - name: Advance verified
        if: github.event_name == 'push'
        run: git push origin HEAD:verified

      # Last, so the previous closure stays fetchable until the ref has moved.
      - name: Prune the binary cache
        if: github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_CACHE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_CACHE_APP_KEY }}
          CACHE_BUCKET: spacefunk-nix-cache
          CACHE_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          CACHE_KEEP: "2"
        run: nix shell nixpkgs#awscli2 nixpkgs#jq -c ./ci/prune-cache.sh
