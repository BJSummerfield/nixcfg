name: upstream-watch

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check the upstream watch entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/upstream-watch.sh
