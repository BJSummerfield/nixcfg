# repeated_keys is disabled repo-wide: the repo deliberately groups option
# assignments near the context that explains them (sops.secrets blocks,
# xdg.configFile pairs, firewall ports beside their service) rather than
# merging them into one distant attrset. statix has no inline suppression,
# only whole-file ignore or a whole-lint disable, so this is the narrower
# of the two available tools.
disabled = [ "repeated_keys" ]
