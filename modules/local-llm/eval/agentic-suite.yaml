schema_version: 1

targets:
  redtruck:
    protocol: openai_chat
    base_url: https://llm.mist-gamma.ts.net:8443/v1
    model: Qwen3.8-27B-NVFP4
    max_concurrency: 3
    request:
      timeout_seconds: 3600
      retries: 2
      retry_interval_seconds: 10

suites:
  smoke:
    jobs:
      - id: bfcl_multi_turn_smoke
        backend: evalscope
        dataset: bfcl_v4
        target: redtruck
        limit: 3
        generation:
          temperature: 0
        backend_args:
          subset_list:
            - multi_turn_base
          is_fc_model: true
          underscore_to_dot: true

      - id: ifbench_smoke
        backend: evalscope
        dataset: ifbench
        target: redtruck
        limit: 3
        generation:
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          max_tokens: 32768
          seed: 42
          extra_body:
            enable_thinking: true
        backend_args:
          few_shot_num: 0
          judge_strategy: rule
          dataset_hub: modelscope

  agentic:
    jobs:
      - id: bfcl_multi_turn
        backend: evalscope
        dataset: bfcl_v4
        target: redtruck
        generation:
          temperature: 0
        backend_args:
          subset_list:
            - multi_turn_base
            - multi_turn_miss_func
            - multi_turn_miss_param
            - multi_turn_long_context
          is_fc_model: true
          underscore_to_dot: true

      - id: ifbench
        backend: evalscope
        dataset: ifbench
        target: redtruck
        generation:
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          max_tokens: 32768
          seed: 42
          extra_body:
            enable_thinking: true
        backend_args:
          few_shot_num: 0
          judge_strategy: rule
          dataset_hub: modelscope

runtime:
  max_parallel_jobs: 1
  runs_dir: runs
  progress:
    enabled: true
    refresh_seconds: 1
    heartbeat_seconds: 30
  samples:
    retention: all
