name: least-privilege-toolsets
version: "1.0.0"
description: "Registers least-privilege custom toolsets for restricted agent roles: `readonly` (read_file, search_files) and `verify` (readonly + terminal, process_manage). Lets a reviewer/verifier profile be given file READ access without write_file/patch, which the indivisible built-in `file` toolset cannot express."
author: "NousResearch / Hermes operator"
manifest_version: 2
kind: standalone
tags:
  - toolsets
  - security
  - least-privilege
